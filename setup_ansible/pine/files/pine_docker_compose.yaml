services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp" # Only required if you are using Pi-hole as your DHCP server
      - "8008:80/tcp"
    environment:
      TZ: 'Europe/London'
      WEBPASSWORD: 'password'
    # Volumes store your data between container upgrades
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    # cap_add:
    #   - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    restart: always #https://stackoverflow.com/questions/43671482/how-to-run-docker-compose-up-d-at-system-start-up

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - DELUGE_LOGLEVEL=info #optional
    volumes:
      - /home/ubuntu/.config/deluge:/config
      - /home/ubuntu/torrent:/torrent
    ports:
      - 8112:8112
      - 6881:6881
      - 6881:6881/udp
      - 58846:58846 #optional
    restart: unless-stopped

  flexget:
    image: wiserain/flexget:3.18.31
    container_name: flexget
    ports:
      - 5050:5050                   # optional: for webui
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London                # optional: defaults to UTC
      - FG_WEBUI_PASSWD={{flexget_web_password}}
    volumes:
      - /home/ubuntu/.config/flexget:/config        # required
      - /home/ubuntu/torrent:/home/ubuntu/torrent
      - /media/ubuntu/Chest/TV Shows:/media/ubuntu/Chest/TV Shows
      - /tmp:/tmp # for config validation
      - ~/flexget-init.d:/custom-cont-init.d/subliminal # custom script to install subliminal for subtitles
    restart: unless-stopped

  mqtt-explorer:
    container_name: mqtt-explorer
    image: smeagolworms4/mqtt-explorer
    restart: always
    ports:
      - 9001:9001
    environment:
      - HTTP_PORT=9001
      - CONFIG_PATH=/mqtt-explorer/config
      - TZ=Europe/Paris
    volumes:
      - ./config:/mqtt-explorer/config
      - /etc/timezone:/etc/timezone:ro

  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser
    environment:
      - FB_BASE_URL=filebrowser
    volumes:
      - /:/srv
      - ~/filebrowser:/database
      - ~/filebrowser:/config
    ports:
      - 8080:80

  yubal:
    image: ghcr.io/guillevc/yubal:latest
    container_name: yubal
    ports:
      - 8000:8000
    environment:
      PUID: 1000
      PGID: 1000
      YUBAL_SCHEDULER_CRON: "0 0 * * *"
      YUBAL_BASE_PATH: yubal
      YUBAL_DOWNLOAD_UGC: false
      YUBAL_TZ: UTC
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped

  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    user: "1000:1000"
    ports:
      - 3923:3923
    volumes:
      - ./copyparty:/cfg:z
      - /media/ubuntu:/w:z
    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.NOPE
      # enable mimalloc by replacing "NOPE" with "2" for a nice speed-boost (will use twice as much ram)

      PYTHONUNBUFFERED: 1
      # ensures log-messages are not delayed (but can reduce speed a tiny bit)

    stop_grace_period: 15s  # thumbnailer is allowed to continue finishing up for 10s after the shutdown signal
    healthcheck:
      # hide it from logs with "/._" so it matches the default --lf-url filter
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s