# Run with
# ansible-playbook setup_dotfiles.yml -i inventory.yml

# Mac
# https://www.reddit.com/r/MacOS/comments/t9a9c8/how_do_i_enable_function_keys_to_work_as_standard/
# iterm - manually configure it as location to load the settings from
# 
---
- hosts: localhost
  vars: 
    os_family: "{{ ansible_facts['os_family'] }}"
  tasks:
    # - name: Add byobu PPA on debian machines
    #   apt_repository: repo='ppa:byobu/ppa' update_cache=yes
    #   when: os_family != 'Darwin'
    #   become: yes

    - name: Install nice CLI packages on Debian systems
      apt:
        pkg:
          - htop
          - byobu
          - git
          - vim
          - ncdu
          - guake
          - git-gui
          - net-tools
          - gitg
          - jq
          - unzip
          # lazygit
          # asdf
          - bat # cat replacement
          #- broot # a better tree
          #- exa # cd replacement
          #- tokei # cloc replacement
        state: present

      when: os_family != 'Darwin'
      become: yes

    - name: Install nice CLI packages on OSX systems
      homebrew:
        state: present
        pkg:
          - htop
          - byobu
          - reattach-to-user-namespace # needed for http://superuser.com/questions/834525/unable-to-launch-application-in-tmux
          - git
          - vim
          - ncdu
          - wget
          - direnv
          - lazygit
          - asdf
          - fzf
          - bat # cat replacement
          - broot # a better tree
          # https://github.com/ogham/exa/issues/1243
          - eza # cd replacement
          - tokei # cloc replacement
      when: os_family == 'Darwin'

    # for FB need to use non standard prefix
    - name: Find brew prefix
      shell: brew --prefix
      register: brew_prefix
      when: os_family == 'Darwin'

    #http://superuser.com/a/373448/160502
    - name: Fix htop for osx
      file: name={{brew_prefix.stdout}}/bin/htop mode=6555 owner=root follow=yes
      become: yes
      when: os_family == 'Darwin'

      #  - name: Install brew cask
      #homebrew: pkg=caskroom/cask/brew-cask
      #when: os_family == 'Darwin'
    - name: Install casks
      when: os_family == 'Darwin'
      ignore_errors: True
      homebrew_cask:
        accept_external_apps: true  # if preinstalled (chrome by company for e.g)
        name:
          - iterm2
          - caffeine
          - benkoppe/tap/blink # instant workspace switch https://github.com/benkoppe/Blink
          - ubar # windows style task bar, can replace dock
          - maccy # copy paste history
          - rectangle # snap to edge resizing
          - alt-tab # better alt tab
          - itsycal # E MMM d h:mm a
          - karabiner-elements
          - sensiblesidebuttons
          - firefox
          - google-chrome
          - ghostty # simpler terminal than iterm2

    # Doesnt work as written, times out. Maybe need to open once after install.. maybe not
    - name: Add casks to login
      when: os_family == 'Darwin'
      tags: login
      shell: osascript -e 'tell application "System Events" to make login item at end with properties {path:"/Applications/{{item}}.app", hidden:false}'
      with_items:
        - Itsycal
        - Caffeine
        - Blink
        - Rectangle
        - uBar
        - SensibleSideButtons

    - name: Checkout/update dotfiles on target machine
      git: repo=https://github.com/ktaragorn/dotfiles.git dest=~/dotfiles force=no
      # Assuming localhost is always updated
      when: ansible_connection != "local"

    - name: Create .ssh folder
      file:
        dest: ~/.ssh
        state: directory

    - name: Copy pine SSH key
      copy:
        mode: 0600
        src: pine/files/pine.key
        dest: ~/.ssh/pine.key

    - name: Pine ssh config section
      blockinfile:
        create: yes
        path: ~/.ssh/config
        block: |
          host pine
            hostname black-gate.privatedns.org

          match host black-gate.privatedns.org
            user ubuntu
            port 22
            identityfile ~/.ssh/pine.key

    - name: Ensure bash files exist
      file:
        state: touch
        path: ~/.{{item}}
      with_items:
        - bashrc
        - bash_profile

    - name: Ensure bash_profile sources bashrc
      lineinfile: dest=~/.bash_profile line=". ~/.bashrc"

    - name: Add source line for bashrc
      lineinfile: dest=~/.bashrc line=". ~/dotfiles/bashrc.d/source_all"

    - name: Link the basic dotfiles which are linked to .file in home
      file: src=dotfiles/{{item}} dest=~/.{{item}} state=link
      with_items:
        - vimrc
        - ngrok
        - rdebugrc 
        - pryrc
        - gemrc
        - bcrc
        - Xmodmap # only used in linux though
        - tmuxinator
        - asdfrc
  
    - name: Include dotfiles gitconfig from main gitconfig at the top (create file if needed) - this allows main gitconfig to customize for local needs (work)
      blockinfile:
        block: |
          [include]
              path = ~/dotfiles/gitconfig
        path: ~/.gitconfig
        insertbefore: BOF
        create: true

    - name: Link inputrc
      file: src=dotfiles/bashrc.d/inputrc dest=~/.inputrc state=link

    #https://github.com/Russell91/sshrc
    - name: Link sshrc file and folder
      file: src=dotfiles/sshrc/{{item}} dest=~/.{{item}} state=link
      with_items:
        - sshrc
        - sshrc.d

    #https://askubuntu.com/questions/7190/why-wont-my-xmodmap-file-load-on-login
    - name: Autostart Xmodmap in linux
      when: os_family != 'Darwin' #gnome only??
      file:
        dest: ~/.config/autostart/
        state: directory

    - name: Autostart Xmodmap and guake in linux
      when: os_family != 'Darwin' #gnome only??
      file: src=~/dotfiles/{{item}}.desktop dest=~/.config/autostart/{{item}}.desktop state=link force=yes mode=u+x
      with_items:
        - my-xmodmap
        - guake

    - name: Create byobu config folder
      file: dest=~/.config/byobu state=directory
      when: os_family != 'Darwin'

    - name: Link tmux.conf in debian systems
      file: src=~/dotfiles/tmux.conf dest=~/.config/byobu/.tmux.conf state=link force=yes
      when: os_family != 'Darwin'

    - name: Create byobu folder in case it doesnt exist
      file: path=~/.byobu state=directory
      when: os_family == 'Darwin'

    - name: Link dotfiles for osx 
      when: os_family == 'Darwin'
      file:
        src: ~/dotfiles/{{item.from}}
        dest: ~/{{item.to}}
        state: link
        force: yes
      with_items:
        - {from: tmux.conf, to: .byobu/.tmux.conf}
        - {from: ghostty/config.ghostty, to: Library/Application Support/com.mitchellh.ghostty/config.ghostty}
        - {from: karabiner/karabiner.json, to: .config/karabiner/karabiner.json}
        - {from: vscode/keybindings.json, to: Library/Application Support/Code/User/keybindings.json}
        - {from: vscode/settings.json, to: Library/Application Support/Code/User/settings.json}

      # From http://lifehacker.com/5826055/make-your-keyboard-keys-repeat-properly-when-held-down-in-mac-os-x-lion
    - name: Fix key repeat on osx
      command: defaults write -g ApplePressAndHoldEnabled -bool false
      when: os_family == 'Darwin'

    - name: Download gah
      get_url: url=https://raw.githubusercontent.com/get-gah/gah/refs/heads/master/tools/install.sh dest=/tmp/gah.sh

    - name: Execute gah installer
      shell: sh /tmp/gah.sh creates=~/.local/bin/gah


